[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jtildeger-tool_call_arg_mismatch_length_profile"
version = "0.1.0"
description = "按段落统计AIGC 内容生成工程师·工具调用的参数错配相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jtildeger" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jtildeger.github.io"
Repository = "https://github.com/jtildeger/tool_call_arg_mismatch_length_profile"
Issues = "https://github.com/jtildeger/tool_call_arg_mismatch_length_profile/issues"

[project.scripts]
tool_call_arg_mismatch_length_profile = "tool_call_arg_mismatch_length_profile:main"

[tool.setuptools]
py-modules = ["tool_call_arg_mismatch_length_profile"]
